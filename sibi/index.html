<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

<script type="text/javascript">
    const URL = "https://teachablemachine.withgoogle.com/models/2T4Iilj2V/";

    let model, webcam, maxPredictions;
    let currentPrediction = "";
    let capsLock = false;
    let isTyping = false;

    let currentConfidence = 0;
    const CONFIDENCE_THRESHOLD = 0.50;
    
    let animationId;
    let isRunning = false;

async function init() {
    if (isRunning) return;

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    startBtn.disabled = true;
    stopBtn.disabled = false;

    if (!model) {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();
    }

    webcam = new tmImage.Webcam(200, 200, true);
    await webcam.setup();
    await webcam.play();

    const webcamContainer = document.getElementById("webcam-container");
    webcamContainer.innerHTML = "";
    webcamContainer.appendChild(webcam.canvas);

    const container = document.getElementById("prediction-container");
    container.innerHTML = "";
    for (let i = 0; i < maxPredictions; i++) {
        const row = document.createElement("div");
        row.classList.add("row");
        row.innerHTML = `
            <span class="label">${String.fromCharCode(65 + i)}</span>
            <div class="bar-container">
                <div class="bar" style="width:0%;"></div>
            </div>
            <span class="percent">0%</span>
        `;
        container.appendChild(row);
    }

    isRunning = true;

    async function loop() {
        if (!isRunning) return;

        await webcam.update();
        const predictions = await model.predict(webcam.canvas);

        // Find most confident
        let highest = predictions[0];
        for (let i = 1; i < predictions.length; i++) {
            if (predictions[i].probability > highest.probability) {
                highest = predictions[i];
            }
        }
        currentPrediction = highest.className;
        currentConfidence = highest.probability;

        // Update bars and highlight most confident
        for (let i = 0; i < predictions.length; i++) {
            const row = container.children[i];
            const bar = row.querySelector(".bar");
            const percent = row.querySelector(".percent");

            const width = Math.round(predictions[i].probability * 100) + "%";
            bar.style.width = width;
            percent.textContent = width;

            row.style.fontWeight = predictions[i].className === currentPrediction ? "bold" : "normal";
        }

        // Update Most Confident element
        const mostConfidentEl = document.getElementById("most-confident");
        if (currentConfidence >= CONFIDENCE_THRESHOLD) {
            mostConfidentEl.innerText = `Most Confident: ${currentPrediction} (${(currentConfidence*100).toFixed(1)}%)`;
        } else {
            mostConfidentEl.innerText = "Most Confident: -";
        }

        animationId = requestAnimationFrame(loop);
    }

    animationId = requestAnimationFrame(loop);
}


// Stop function
function stop() {
    if (!isRunning) return;

    cancelAnimationFrame(animationId);
    webcam.stop();
    const webcamContainer = document.getElementById("webcam-container");
    webcamContainer.innerHTML = "";

    isRunning = false;

    document.getElementById("startBtn").disabled = false;
    document.getElementById("stopBtn").disabled = true;
}

// Button event listeners
document.getElementById("startBtn").addEventListener("click", init);
document.getElementById("stopBtn").addEventListener("click", stop);

// Initialize Stop button as disabled
document.getElementById("stopBtn").disabled = true;


    async function predict() {
    const prediction = await model.predict(webcam.canvas);

    let highest = prediction[0];
    for (let i = 1; i < prediction.length; i++) {
        if (prediction[i].probability > highest.probability) {
            highest = prediction[i];
        }
    }

    currentPrediction = highest.className;
    currentConfidence = highest.probability;

    const container = document.getElementById("prediction-container");

    for (let i = 0; i < maxPredictions; i++) {
        const className = prediction[i].className;
        const probability = prediction[i].probability;

        const row = container.childNodes[i];
        row.querySelector(".label").innerText = className;
        row.querySelector(".percent").innerText =
            " " + (probability * 100).toFixed(1) + "%";
        row.querySelector(".bar").style.width =
            `${Math.round(probability * 100)}%`;

        row.style.fontWeight = className === currentPrediction ? "bold" : "normal";
    }

    const mostConfidentEl = document.getElementById("most-confident");
    if (currentConfidence >= CONFIDENCE_THRESHOLD) {
        mostConfidentEl.innerText = `Most Confident: ${currentPrediction} (${(currentConfidence*100).toFixed(1)}%)`;
    } else {
        mostConfidentEl.innerText = "Most Confident: -";
    }
}







    function confirmLetter() {
    if (currentConfidence >= CONFIDENCE_THRESHOLD) {
        let letter = currentPrediction;

        if (!capsLock) {
            letter = letter.toLowerCase();
        }

        typeLetter(letter);
    }
}


    function addSpace() {
    typeLetter(" ");
}
    function backspace() {
    const textBox = document.getElementById("text-box");
    textBox.value = textBox.value.slice(0, -1);
}


    function toggleCaps() {
    capsLock = !capsLock;

    const btn = document.getElementById("caps-btn");
    btn.innerText = capsLock ? "Caps: ON" : "Caps: OFF";
}






    function typeLetter(letter) {
    if (isTyping) return;
    isTyping = true;

    const textBox = document.getElementById("text-box");

    let index = 0;

    function typeStep() {
        if (index < letter.length) {
            textBox.value += letter[index];
            index++;
            setTimeout(typeStep, 50);
        } else {
            isTyping = false;
        }
    }

    typeStep();
}

document.addEventListener("keydown", function(event) {

    // Confirm with Enter
    if (event.key === "Enter") {
        event.preventDefault();
        confirmLetter();
    }

    // Backspace shortcut
    if (event.key === "Backspace") {
        event.preventDefault();
        backspace();
    }

    // Space shortcut
    if (event.key === " ") {
        event.preventDefault();
        addSpace();
    }

});


</script>

<script>
  const buttons = document.querySelectorAll(".dropbtn");
  const menus = document.querySelectorAll(".dropdown-menu");
  const hamburger = document.querySelector(".hamburger");
  const nav = document.querySelector(".nav-links");

  buttons.forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();

      const menu = document.getElementById(btn.dataset.dropdown);

      menus.forEach(m => {
        if (m !== menu) m.classList.remove("active");
      });

      buttons.forEach(b => b.classList.remove("active"));

      const isOpen = menu.classList.toggle("active");
      btn.classList.toggle("active", isOpen);
    });

    btn.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") btn.click();
      if (e.key === "Escape") closeAll();
    });
  });

  function closeAll() {
    menus.forEach(m => m.classList.remove("active"));
    buttons.forEach(b => b.classList.remove("active"));
  }

  document.addEventListener("click", closeAll);

  hamburger.addEventListener("click", () => {
    const expanded = nav.classList.toggle("open");
    hamburger.setAttribute("aria-expanded", expanded);
  });
</script>
