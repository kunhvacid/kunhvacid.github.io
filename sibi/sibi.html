<script type="text/javascript">
    const URL = "https://teachablemachine.withgoogle.com/models/2T4Iilj2V/";

    let model, webcam, maxPredictions;
    let currentPrediction = "";
    let capsLock = false;
    let isTyping = false;

    let currentConfidence = 0;
    const CONFIDENCE_THRESHOLD = 0.50;
    
    let animationId;
    let isRunning = false;

async function init() {
    if (isRunning) return;

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    startBtn.disabled = true;
    stopBtn.disabled = false;

    // Load model if not loaded
    if (!model) {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();
    }

    // Get actual class labels from model
    const classNames = model.getClassLabels();

    // Setup webcam
    webcam = new tmImage.Webcam(200, 200, true);
    await webcam.setup();
    await webcam.play();

    // Show webcam in container
    const webcamContainer = document.getElementById("webcam-container");
    webcamContainer.innerHTML = "";
    webcamContainer.appendChild(webcam.canvas);

    // Show output box directly under webcam
    const outputSection = document.querySelector(".output-section");
    outputSection.style.marginTop = "10px";

    // Prepare prediction container with actual class names
    const container = document.getElementById("prediction-container");
    container.innerHTML = "";
    for (let i = 0; i < maxPredictions; i++) {
        const row = document.createElement("div");
        row.classList.add("row");
        row.innerHTML = `
            <span class="label">${classNames[i]}</span>
            <div class="bar-container">
                <div class="bar" style="width:0%;"></div>
            </div>
            <span class="percent">0%</span>
        `;
        container.appendChild(row);
    }

    isRunning = true;

    // Prediction loop
    async function loop() {
        if (!isRunning) return;

        await webcam.update();
        const predictions = await model.predict(webcam.canvas);

        // Find most confident prediction
        let highest = predictions[0];
        for (let i = 1; i < predictions.length; i++) {
            if (predictions[i].probability > highest.probability) {
                highest = predictions[i];
            }
        }
        currentPrediction = highest.className;
        currentConfidence = highest.probability;

        // Update bars
        for (let i = 0; i < predictions.length; i++) {
            const row = container.children[i];
            const bar = row.querySelector(".bar");
            const percent = row.querySelector(".percent");

            const width = Math.round(predictions[i].probability * 100) + "%";
            bar.style.width = width;
            percent.textContent = width;

            row.style.fontWeight = predictions[i].className === currentPrediction ? "bold" : "normal";
        }

        // Update Most Confident text
        const mostConfidentEl = document.getElementById("most-confident");
        if (currentConfidence >= CONFIDENCE_THRESHOLD) {
            mostConfidentEl.innerText = `Most Confident: ${currentPrediction} (${(currentConfidence*100).toFixed(1)}%)`;
        } else {
            mostConfidentEl.innerText = "Most Confident: -";
        }

        animationId = requestAnimationFrame(loop);
    }

    animationId = requestAnimationFrame(loop);
}

// Stop function: stops webcam and removes view
function stop() {
    if (!isRunning) return;

    cancelAnimationFrame(animationId);
    webcam.stop();
    isRunning = false;

    document.getElementById("startBtn").disabled = false;
    document.getElementById("stopBtn").disabled = true;

    // Remove webcam view
    const webcamContainer = document.getElementById("webcam-container");
    webcamContainer.innerHTML = "";

    // Reset most confident text
    const mostConfidentEl = document.getElementById("most-confident");
    mostConfidentEl.innerText = "Most Confident: -";
}








    function confirmLetter() {
    if (currentConfidence >= CONFIDENCE_THRESHOLD) {
        let letter = currentPrediction;

        if (!capsLock) {
            letter = letter.toLowerCase();
        }

        typeLetter(letter);
    }
}


    function addSpace() {
    typeLetter(" ");
}
    function backspace() {
    const textBox = document.getElementById("text-box");
    textBox.value = textBox.value.slice(0, -1);
}


    function toggleCaps() {
    capsLock = !capsLock;

    const btn = document.getElementById("caps-btn");
    btn.innerText = capsLock ? "Caps: ON" : "Caps: OFF";
}






    function typeLetter(letter) {
    if (isTyping) return;
    isTyping = true;

    const textBox = document.getElementById("text-box");

    let index = 0;

    function typeStep() {
        if (index < letter.length) {
            textBox.value += letter[index];
            index++;
            setTimeout(typeStep, 50);
        } else {
            isTyping = false;
        }
    }

    typeStep();
}

document.addEventListener("keydown", function(event) {

    if (currentMode !== "signToText") return;

    if (event.key === "Enter") {
        event.preventDefault();
        confirmLetter();
    }

    if (event.key === "Backspace") {
        event.preventDefault();
        backspace();
    }

    if (event.key === " ") {
        event.preventDefault();
        addSpace();
    }

});


</script>

<script>
  const buttons = document.querySelectorAll(".dropbtn");
  const menus = document.querySelectorAll(".dropdown-menu");
  const hamburger = document.querySelector(".hamburger");
  const nav = document.querySelector(".nav-links");

  buttons.forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();

      const menu = document.getElementById(btn.dataset.dropdown);

      menus.forEach(m => {
        if (m !== menu) m.classList.remove("active");
      });

      buttons.forEach(b => b.classList.remove("active"));

      const isOpen = menu.classList.toggle("active");
      btn.classList.toggle("active", isOpen);
    });

    btn.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") btn.click();
      if (e.key === "Escape") closeAll();
    });
  });

  function closeAll() {
    menus.forEach(m => m.classList.remove("active"));
    buttons.forEach(b => b.classList.remove("active"));
  }

  document.addEventListener("click", closeAll);

  hamburger.addEventListener("click", () => {
    const expanded = nav.classList.toggle("open");
    hamburger.setAttribute("aria-expanded", expanded);
  });








// ==============================
// FULL MODE SWITCH SYSTEM
// ==============================

let currentMode = "signToText";

function setMode(mode) {
    currentMode = mode;

    const root = document.getElementById("translator-root");
    root.innerHTML = "";

    if (mode === "signToText") {
        root.innerHTML = `
        <div class="main-layout">

            <div class="controls">
                <button id="startBtn" onclick="init()">Start</button>
                <button id="stopBtn" onclick="stop()" disabled>Stop</button>
            </div>

            <div class="left-panel">
                <h3>Predictions</h3>
                <div id="prediction-container"></div>
            </div>

            <div class="right-panel">
                <div class="camera-section">
                    <div id="webcam-container"></div>
                    <div id="most-confident"
                        style="margin-top:10px; font-size:18px; font-weight:600;">
                        Most Confident: -
                    </div>
                </div>

                <div class="output-section">
                    <h3>Output</h3>
                    <input type="text" id="text-box" readonly />
                    <div class="output-buttons">
                        <button onclick="confirmLetter()">Confirm (Enter)</button>
                        <button onclick="addSpace()">Space</button>
                        <button onclick="backspace()">Backspace</button>
                        <button onclick="toggleCaps()" id="caps-btn">Caps: OFF</button>
                    </div>
                </div>
            </div>
        </div>
        `;
    }

    if (mode === "textToSign") {
        // Stop webcam if switching away
        if (isRunning) stop();

        root.innerHTML = `
        <div style="max-width:700px; margin:auto; text-align:center;">

            <h3>Text → Alphabet Signs</h3>

            <input type="text" id="tts-input"
                   maxlength="25"
                   style="margin-top:15px; padding:10px; width:100%; border-radius:8px; border:none;"
                   placeholder="Max 25 characters">

            <div style="margin-top:15px;">
                <button onclick="generateAlphabetSigns()">Generate</button>
                <button onclick="clearAlphabetSigns()">Clear</button>
            </div>

            <div id="alphabet-sequence"
                 style="margin-top:25px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center;">
            </div>

        </div>
        `;

 input.addEventListener("input", () => {
    renderAlphabet(input.value.toLowerCase());
});
    }
}


// ==============================
// TEXT → ALPHABET (LIVE RENDER)
// ==============================

function generateAlphabetSigns() {
    const input = document.getElementById("tts-input").value.toLowerCase();
    renderAlphabet(input);
}

function renderAlphabet(text) {
    const container = document.getElementById("alphabet-sequence");
    container.innerHTML = "";

    for (let char of text) {

        if (char === " ") {
            const spacer = document.createElement("div");
            spacer.style.width = "20px";
            container.appendChild(spacer);
            continue;
        }

        if (/[a-z]/.test(char)) {
            const img = document.createElement("img");
            img.src = `https://kunhvacid.github.io/sibi/alphabet/${char}.jpg`;
            img.style.width = "80px";
            img.style.borderRadius = "8px";
            container.appendChild(img);
        }
    }
}





function clearAlphabetSigns() {
    document.getElementById("tts-input").value = "";
    document.getElementById("alphabet-sequence").innerHTML = "";
}

// Initialize default mode
window.addEventListener("DOMContentLoaded", () => {
    setMode("signToText");
    
    
});


</script>
